# Adapter: Kilo Code (VSCode extension)
#
# Read by both installation channels (AI-agent installer, install.ps1 and install.sh).

tool: kilocode
schemaVersion: 3

detection:
  - exists: ".kilo/"

rules:
  copyTo: ".kilo/rules/{name}.md"
  frontmatter:
    keep: [description, alwaysApply]
    drop: [globs, category]

agents:
  copyTo: ".kilo/agents/{name}.md"
  
  frontmatter:
    keep: [description]
    
    # All 1C agents from content/agents/ are subagents (per AGENTS.md)
    add:
      mode: "subagent"
      temperature: 0.2
      steps: 15
      permission:
        task:
          "*": "deny"
          "general": "allow"
          "explore": "allow"
        edit: "allow"
        bash: "allow"
    
    drop: [name, tools, modelHint, allowParallel, reasoningEffort]

commands:
  copyTo: ".kilo/workflows/{name}.md"
  frontmatter:
    keep: [description]
    drop: [argumentHint, allowedTools]

skills:
  copyTo: ".kilo/skills/{name}/"
  mode: verbatim

mcp:
  source: "content/mcp-servers.json"
  target: "kilo.jsonc"
  schema: mcp
  format: jsonc
