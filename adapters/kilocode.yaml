# Adapter: Kilo Code (VSCode extension)
#
# Describes how to copy and adapt files from content/ for Kilo Code.
# Read by both installation channels (AI-agent installer and install.ps1).
#
# Schema: see ARCHITECTURE.md §7 and §7.1 (closed operation set).
# Notes:
#   - Directory .kilo/ is the current standard (replaces the legacy .kilocode/
#     which is no longer used in the rebuilt extension; see github.com/Kilo-Org/kilocode/issues/6874).
#   - Agents (custom modes / subagents) live in .kilo/agents/ (not subagents/).
#     Filename (without .md) is the agent name — `name` frontmatter is ignored by Kilo.
#     `tools` array is Cursor-specific and dropped; Kilo uses `permission` object instead.
#     `modelHint` is dropped — generic hints (opus/haiku) are not valid Kilo model IDs;
#     agents inherit the project default model.
#     `mode: subagent` (only invoked via delegation) or `mode: all` (primary + subagent).
#     Source flag `isSubagent: true` maps to `mode: subagent`; otherwise `mode: all`.
#   - Slash-commands are stored as Kilo "workflows" in .kilo/workflows/.
#   - Skills follow the Anthropic SKILL.md standard; Kilo Code discovers them
#     from .kilo/skills/.
#   - .kilo/kilo.jsonc is the single config file for the rebuilt extension. It
#     contains both `mcp` (server list, type: local/remote) and `instructions`
#     (["AGENTS.md", ".kilo/rules/**/*.md"]) — Kilo does not auto-discover
#     .kilo/rules/ without an explicit entry in `instructions`.

tool: kilocode
schemaVersion: 1

detection:
  - exists: ".kilo/"

rules:
  copyTo: ".kilo/rules/{name}.md"
  frontmatter:
    keep: [description, alwaysApply]
    drop: [globs, category]

agents:
  copyTo: ".kilo/agents/{name}.md"
  frontmatter:
    keep: [description]
    addIf:
      isSubagent: { mode: subagent }
      "!isSubagent": { mode: all }
    drop: [name, tools, modelHint, allowParallel, reasoningEffort]

commands:
  copyTo: ".kilo/workflows/{name}.md"
  frontmatter:
    keep: [description]
    drop: [argumentHint, allowedTools]

skills:
  copyTo: ".kilo/skills/{name}/"
  mode: verbatim

mcp:
  source: "content/mcp-servers.json"
  target: ".kilo/kilo.jsonc"
  schema: mcp
  format: jsonc
